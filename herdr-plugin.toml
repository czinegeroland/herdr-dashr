# Live Grafana dashboards your AI agent builds, beside your chat in Herdr.
# Generated by `dashr herdr manifest` from crates/dashr-herdr/src/manifest.rs.

id = "herdr-dashr"
name = "herdr-dashr"
version = "1.0.0"
min_herdr_version = "0.9.0"
description = "Live Grafana dashboards your AI agent builds, right beside your chat in Herdr."
platforms = ["linux", "macos", "windows"]

[[build]]
command = ["cmd", "/c", "npm", "install", "--no-save", "--no-audit", "--no-fund", "herdr-dashr@1.0.0"]
platforms = ["windows"]

[[build]]
command = ["npm", "install", "--no-save", "--no-audit", "--no-fund", "herdr-dashr@1.0.0"]
platforms = ["linux", "macos"]

[[build]]
command = ["node", "node_modules/herdr-dashr/bin.js", "global", "install", "--best-effort"]

[[build]]
command = ["cmd", "/c", "npx", "--yes", "skills", "add", "czinegeroland/herdr-dashr", "--skill", "herdr-dashr", "--global", "--yes"]
platforms = ["windows"]

[[build]]
command = ["npx", "--yes", "skills", "add", "czinegeroland/herdr-dashr", "--skill", "herdr-dashr", "--global", "--yes"]
platforms = ["linux", "macos"]

[[startup]]
command = ["node", "node_modules/herdr-dashr/bin.js", "herdr", "startup"]

[[actions]]
id = "open"
title = "Open live dashboard"
description = "Open a Grafana dashboard with an agent beside it."
contexts = ["workspace", "pane"]
command = ["node", "node_modules/herdr-dashr/bin.js", "herdr", "action", "open"]

[[actions]]
id = "pipeline"
title = "Open dashboard for a CodePipeline"
description = "Ctrl-click a CodePipeline link to get a dashboard of what it deployed."
contexts = ["workspace", "pane"]
command = ["node", "node_modules/herdr-dashr/bin.js", "herdr", "action", "pipeline"]

[[actions]]
id = "otel"
title = "Open live logs and traces (OpenTelemetry)"
description = "Open a dashboard that receives your program's logs, traces and metrics."
contexts = ["workspace", "pane"]
command = ["node", "node_modules/herdr-dashr/bin.js", "herdr", "action", "otel"]

[[actions]]
id = "promote"
title = "Promote dashboard to persistent Grafana"
description = "Copy the current dashboard to your team's Grafana."
contexts = ["workspace", "pane"]
command = ["node", "node_modules/herdr-dashr/bin.js", "herdr", "action", "promote"]

[[actions]]
id = "doctor"
title = "Check dashr prerequisites"
description = "Check Docker, Herdr and the other tools dashr uses."
contexts = ["workspace", "pane"]
command = ["node", "node_modules/herdr-dashr/bin.js", "herdr", "action", "doctor"]

[[events]]
on = "pane.closed"
command = ["node", "node_modules/herdr-dashr/bin.js", "herdr", "event", "pane-closed"]

[[panes]]
id = "dashboard"
title = "dashr"
placement = "split"
command = ["node", "node_modules/herdr-dashr/bin.js", "herdr", "pane", "dashboard"]

[[panes]]
id = "doctor"
title = "dashr doctor"
placement = "popup"
width = "80%"
height = "70%"
command = ["node", "node_modules/herdr-dashr/bin.js", "herdr", "pane", "doctor"]

[[link_handlers]]
id = "codepipeline"
title = "Open a live dashboard for this pipeline"
pattern = '^https://([a-z0-9-]+\.)?console\.aws\.amazon\.com/(codesuite/codepipeline/pipelines/|codepipeline/home)'
action = "pipeline"
