# dashr: end-to-end testing by traces, beside your AI agent in Herdr.
# Generated by `dashr herdr manifest` from crates/dashr-herdr/src/manifest.rs.

id = "herdr-dashr"
name = "herdr-dashr"
version = "2.0.0"
min_herdr_version = "0.9.0"
description = "End-to-end testing by traces: your AI agent instruments a feature with OpenTelemetry, you review the planned spans, and every service's spans — local, AWS X-Ray, Azure, Google Cloud, Jaeger, Zipkin — meet in one live sequence diagram the agent checks against the expected flow."
platforms = ["linux", "macos", "windows"]

[[build]]
command = ["cmd", "/c", "npm", "install", "--prefix", ".", "--no-save", "--no-audit", "--no-fund", "herdr-dashr@2.0.0"]
platforms = ["windows"]

[[build]]
command = ["npm", "install", "--prefix", ".", "--no-save", "--no-audit", "--no-fund", "herdr-dashr@2.0.0"]
platforms = ["linux", "macos"]

[[build]]
command = ["node", "node_modules/herdr-dashr/bin.js", "global", "install", "--best-effort"]

[[build]]
command = ["cmd", "/c", "npx", "--yes", "skills", "add", "czinegeroland/herdr-dashr", "--skill", "herdr-dashr", "--global", "--yes"]
platforms = ["windows"]

[[build]]
command = ["npx", "--yes", "skills", "add", "czinegeroland/herdr-dashr", "--skill", "herdr-dashr", "--global", "--yes"]
platforms = ["linux", "macos"]

[[startup]]
command = ["node", "node_modules/herdr-dashr/bin.js", "herdr", "startup"]

[[actions]]
id = "open"
title = "Open trace session"
description = "Open a live trace session (Jaeger, sequence diagrams, flow checks) beside this pane."
contexts = ["workspace", "pane"]
command = ["node", "node_modules/herdr-dashr/bin.js", "herdr", "action", "open"]

[[actions]]
id = "doctor"
title = "Check dashr prerequisites"
description = "Check Docker, Herdr and the other tools dashr uses."
contexts = ["workspace", "pane"]
command = ["node", "node_modules/herdr-dashr/bin.js", "herdr", "action", "doctor"]

[[events]]
on = "pane.closed"
command = ["node", "node_modules/herdr-dashr/bin.js", "herdr", "event", "pane-closed"]

[[panes]]
id = "traces"
title = "dashr"
placement = "split"
command = ["node", "node_modules/herdr-dashr/bin.js", "herdr", "pane", "traces"]

[[panes]]
id = "doctor"
title = "dashr doctor"
placement = "popup"
width = "80%"
height = "70%"
command = ["node", "node_modules/herdr-dashr/bin.js", "herdr", "pane", "doctor"]
