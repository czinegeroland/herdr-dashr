# Generated by `dashr herdr manifest`. Do not edit by hand.
#
# The source of truth is `crates/dashr-herdr/src/manifest.rs`, and
# `crates/dashr-cli/tests/plugin_manifest.rs` fails if this file and that
# module disagree. Regenerate with:
#
#     cargo run --quiet --bin dashr -- herdr manifest > herdr-plugin.toml

id = "herdr-dashr"
name = "Herdr Dashr"
version = "0.1.3"
min_herdr_version = "0.9.0"
description = "Live Grafana dashboards in a Herdr pane."
platforms = ["linux", "macos", "windows"]

[[build]]
command = ["cmd", "/c", "npm", "install", "--no-save", "--no-audit", "--no-fund", "herdr-dashr@0.1.3"]
platforms = ["windows"]

[[build]]
command = ["npm", "install", "--no-save", "--no-audit", "--no-fund", "herdr-dashr@0.1.3"]
platforms = ["linux", "macos"]

[[build]]
command = ["cmd", "/c", "npx", "--yes", "skills", "add", "czinegeroland/herdr-dashr", "--skill", "herdr-dashr", "--agent", "claude-code", "--global", "--yes"]
platforms = ["windows"]

[[build]]
command = ["npx", "--yes", "skills", "add", "czinegeroland/herdr-dashr", "--skill", "herdr-dashr", "--agent", "claude-code", "--global", "--yes"]
platforms = ["linux", "macos"]

[[startup]]
command = ["node", "node_modules/herdr-dashr/bin.js", "herdr", "startup"]

[[actions]]
id = "open"
title = "Open live dashboard"
contexts = ["workspace", "pane"]
command = ["node", "node_modules/herdr-dashr/bin.js", "herdr", "action", "open"]

[[actions]]
id = "pipeline"
title = "Open dashboard for a CodePipeline"
contexts = ["workspace", "pane"]
command = ["node", "node_modules/herdr-dashr/bin.js", "herdr", "action", "pipeline"]

[[actions]]
id = "otel"
title = "Open live logs and traces (OpenTelemetry)"
contexts = ["workspace", "pane"]
command = ["node", "node_modules/herdr-dashr/bin.js", "herdr", "action", "otel"]

[[actions]]
id = "promote"
title = "Promote dashboard to persistent Grafana"
contexts = ["workspace", "pane"]
command = ["node", "node_modules/herdr-dashr/bin.js", "herdr", "action", "promote"]

[[actions]]
id = "doctor"
title = "Check dashr prerequisites"
contexts = ["workspace", "pane"]
command = ["node", "node_modules/herdr-dashr/bin.js", "herdr", "action", "doctor"]

[[events]]
on = "pane.closed"
command = ["node", "node_modules/herdr-dashr/bin.js", "herdr", "event", "pane-closed"]

[[panes]]
id = "dashboard"
title = "dashr"
placement = "tab"
command = ["node", "node_modules/herdr-dashr/bin.js", "herdr", "pane", "dashboard"]

[[panes]]
id = "doctor"
title = "dashr doctor"
placement = "popup"
width = "80%"
height = "70%"
command = ["node", "node_modules/herdr-dashr/bin.js", "herdr", "pane", "doctor"]

[[link_handlers]]
id = "codepipeline"
title = "Open a live dashboard for this pipeline"
pattern = '^https://([a-z0-9-]+\.)?console\.aws\.amazon\.com/(codesuite/codepipeline/pipelines/|codepipeline/home)'
action = "pipeline"
