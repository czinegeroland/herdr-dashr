# Generated by `dashr herdr manifest`. Do not edit by hand.
#
# The source of truth is `crates/dashr-herdr/src/manifest.rs`, and
# `crates/dashr-cli/tests/plugin_manifest.rs` fails if this file and that
# module disagree. Regenerate with:
#
#     cargo run --quiet --bin dashr -- herdr manifest > herdr-plugin.toml

id = "herdr-dashr"
name = "Herdr Dashr"
version = "0.1.0"
min_herdr_version = "0.9.0"
description = "Agent-built, live Grafana dashboards in a Herdr pane, with masking between your data and the agent."
platforms = ["linux", "macos"]

[[build]]
command = ["sh", "scripts/install.sh"]

[[build]]
command = ["bin/dashr", "skill", "install", "--best-effort"]

[[startup]]
command = ["bin/dashr", "herdr", "startup"]

[[actions]]
id = "open"
title = "Open live dashboard"
contexts = ["workspace", "pane"]
command = ["bin/dashr", "herdr", "action", "open"]

[[actions]]
id = "pipeline"
title = "Open dashboard for a CodePipeline"
contexts = ["workspace", "pane"]
command = ["bin/dashr", "herdr", "action", "pipeline"]

[[actions]]
id = "otel"
title = "Open live logs and traces (OpenTelemetry)"
contexts = ["workspace", "pane"]
command = ["bin/dashr", "herdr", "action", "otel"]

[[actions]]
id = "promote"
title = "Promote dashboard to persistent Grafana"
contexts = ["workspace", "pane"]
command = ["bin/dashr", "herdr", "action", "promote"]

[[actions]]
id = "doctor"
title = "Check dashr prerequisites"
contexts = ["workspace", "pane"]
command = ["bin/dashr", "herdr", "action", "doctor"]

[[events]]
on = "pane.closed"
command = ["bin/dashr", "herdr", "event", "pane-closed"]

[[panes]]
id = "dashboard"
title = "dashr"
placement = "tab"
command = ["bin/dashr", "herdr", "pane", "dashboard"]

[[panes]]
id = "doctor"
title = "dashr doctor"
placement = "popup"
width = "80%"
height = "70%"
command = ["bin/dashr", "herdr", "pane", "doctor"]

[[link_handlers]]
id = "codepipeline"
title = "Open a live dashboard for this pipeline"
pattern = '^https://([a-z0-9-]+\.)?console\.aws\.amazon\.com/(codesuite/codepipeline/pipelines/|codepipeline/home)'
action = "pipeline"
