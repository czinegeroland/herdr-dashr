name: Unpublish from npm

# Removes pre-1.0 test versions of herdr-dashr and its platform packages
# from npm (DEC-042). Manual only. npm allows unpublishing a version within
# 72 hours of publishing it; later it refuses, and the step says so.
# Unpublished versions can never be published again. The root package goes
# first because it depends on the platform packages.
on:
  workflow_dispatch:
    inputs:
      versions:
        description: Space-separated versions to remove, for example "0.1.0 0.1.1"
        required: true
        type: string
      confirm:
        description: Type "unpublish" to confirm
        required: true
        type: string

permissions:
  contents: read

jobs:
  unpublish:
    name: Unpublish from npm
    runs-on: ubuntu-latest
    if: inputs.confirm == 'unpublish'
    steps:
      - uses: actions/setup-node@v5
        with:
          node-version: '22.x'
          registry-url: https://registry.npmjs.org
      - name: Unpublish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          VERSIONS: ${{ inputs.versions }}
        shell: bash
        run: |
          set -uo pipefail
          npm whoami >/dev/null || { echo "::error::NPM_TOKEN does not authenticate"; exit 1; }
          packages="herdr-dashr herdr-dashr-linux-x64 herdr-dashr-linux-arm64 herdr-dashr-darwin-x64 herdr-dashr-darwin-arm64 @czinegeroland/herdr-dashr-win32-x64"
          failed=0
          for version in $VERSIONS; do
            case "$version" in
              1.*|[2-9].*) echo "::error::refusing to unpublish $version: only pre-1.0 test versions"; exit 1 ;;
            esac
          done
          for package in $packages; do
            for version in $VERSIONS; do
              if ! npm view "$package@$version" version >/dev/null 2>&1; then
                echo "$package@$version: not published"
                continue
              fi
              if npm unpublish "$package@$version" 2>&1 | tee /tmp/out; [ "${PIPESTATUS[0]}" -eq 0 ]; then
                echo "$package@$version: unpublished"
              else
                echo "::error::$package@$version could not be unpublished"
                failed=1
              fi
            done
          done
          exit "$failed"
