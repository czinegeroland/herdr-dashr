name: End to end

# DASHR-TECH-003: the real binary, a real Jaeger container, services
# instrumented with the real OpenTelemetry SDK, a real Herdr server with the
# plugin linked from this checkout, and a real Chrome showing the viewer
# (scripts/e2e/run.sh).
# Linux only: GitHub's macOS runners have no Docker.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: end-to-end-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  e2e:
    name: End to end
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: Install the pinned toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: e2e
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo build --locked --bin dashr
      - run: scripts/e2e/run.sh target/debug/dashr
        env:
          DASHR_E2E_ARTIFACTS: ${{ github.workspace }}/e2e-screens
      # Pictures of the running product from the Chrome scenarios.
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: e2e-screens
          path: e2e-screens/
          if-no-files-found: ignore
