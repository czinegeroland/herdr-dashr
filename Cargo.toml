[workspace]
resolver = "3"
members = [
    "crates/dashr-core",
    "crates/dashr-herdr",
    "crates/dashr-runtime",
    "crates/dashr-cli",
]

[workspace.package]
version = "2.0.0"
edition = "2024"
rust-version = "1.85"
license = "Apache-2.0"
repository = "https://github.com/czinegeroland/herdr-dashr"

[workspace.dependencies]
dashr-core = { path = "crates/dashr-core" }
dashr-herdr = { path = "crates/dashr-herdr" }
dashr-runtime = { path = "crates/dashr-runtime" }

clap = { version = "4", features = ["derive", "env"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1"
regex = "1"
thiserror = "2"
# Blocking HTTP client: `dashr` talks to its own session on loopback. An
# async runtime would buy nothing here (DEC-007).
ureq = { version = "3", features = ["json"] }
# OTLP exporters may gzip their requests (OTEL_EXPORTER_OTLP_COMPRESSION).
flate2 = "1"
signal-hook = "0.4"
tempfile = "3"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
