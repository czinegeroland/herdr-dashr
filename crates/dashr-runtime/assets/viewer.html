<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>dashr traces</title>
<link rel="preconnect" href="https://fonts.googleapis.com">

<script>
// Before the first paint, so a dark theme never flashes light.
try { const t = localStorage.getItem("dashr-theme"); if (t === "light" || t === "dark") document.documentElement.dataset.theme = t; } catch {}
</script>
<style>
:root {
  color-scheme: light;
  --bg: #f4f5f8; --bg2: #eceef3; --panel: #ffffff; --panel2: #f9fafc; --ink: #14161c; --muted: #646a78; --faint: #9aa0ad;
  --line: #e2e5ec; --line2: #d3d7e0; --accent: #4f5bd5; --accent2: #7c4dd8; --accent-soft: #eceefe; --accent-ink: #3b45b8;
  --ok: #138a52; --ok-soft: #e2f5ea; --bad: #d1372b; --bad-soft: #fde8e6; --warn: #b26a00; --warn-soft: #fff1d9;
  --life: #c8ccd6; --shadow: 0 1px 2px rgba(16, 20, 40, .06), 0 4px 16px rgba(16, 20, 40, .05);
  --shadow-lg: 0 8px 30px rgba(16, 20, 40, .10); --glow: rgba(79, 91, 213, .16); --code-line: rgba(79, 91, 213, .13);
  --sans: Inter, system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --bg: #0d0f14; --bg2: #12151c; --panel: #161a22; --panel2: #1b2029; --ink: #e8eaf0; --muted: #9aa1b2; --faint: #6b7283;
    --line: #262b36; --line2: #323846; --accent: #8b95ff; --accent2: #b28cff; --accent-soft: #1f2440; --accent-ink: #aab2ff;
    --ok: #4cd68e; --ok-soft: #12301f; --bad: #ff7468; --bad-soft: #3a1714; --warn: #f5b95a; --warn-soft: #3a2a10;
    --life: #343a48; --shadow: 0 1px 2px rgba(0, 0, 0, .4), 0 4px 18px rgba(0, 0, 0, .25);
    --shadow-lg: 0 10px 34px rgba(0, 0, 0, .45); --glow: rgba(139, 149, 255, .18); --code-line: rgba(139, 149, 255, .16);
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --bg: #0d0f14; --bg2: #12151c; --panel: #161a22; --panel2: #1b2029; --ink: #e8eaf0; --muted: #9aa1b2; --faint: #6b7283;
  --line: #262b36; --line2: #323846; --accent: #8b95ff; --accent2: #b28cff; --accent-soft: #1f2440; --accent-ink: #aab2ff;
  --ok: #4cd68e; --ok-soft: #12301f; --bad: #ff7468; --bad-soft: #3a1714; --warn: #f5b95a; --warn-soft: #3a2a10;
  --life: #343a48; --shadow: 0 1px 2px rgba(0, 0, 0, .4), 0 4px 18px rgba(0, 0, 0, .25);
  --shadow-lg: 0 10px 34px rgba(0, 0, 0, .45); --glow: rgba(139, 149, 255, .18); --code-line: rgba(139, 149, 255, .16);
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); font: 14px/1.5 var(--sans);
  -webkit-font-smoothing: antialiased; transition: background-color .2s, color .2s; }
button { font: inherit; color: inherit; cursor: pointer; }
a { color: var(--accent); text-decoration: none; } a:hover { text-decoration: underline; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 6px; }
::-webkit-scrollbar { width: 10px; height: 10px; } ::-webkit-scrollbar-thumb { background: var(--line2); border-radius: 10px; border: 2px solid transparent; background-clip: padding-box; }
::-webkit-scrollbar-track { background: transparent; }
header { display: flex; align-items: center; gap: 18px; padding: 10px 18px; height: 58px; border-bottom: 1px solid var(--line);
  background: color-mix(in srgb, var(--panel) 85%, transparent); backdrop-filter: blur(10px); position: relative; z-index: 3; }
.brand { display: flex; align-items: center; gap: 10px; font-weight: 700; font-size: 16px; letter-spacing: -.2px; }
.brand svg { display: block; }
.live { display: inline-flex; align-items: center; gap: 6px; font-size: 11.5px; font-weight: 600; color: var(--ok); background: var(--ok-soft); padding: 2px 9px 2px 7px; border-radius: 99px; }
.live i { width: 7px; height: 7px; border-radius: 50%; background: currentColor; box-shadow: 0 0 0 0 currentColor; animation: pulse 2s infinite; }
.live.off { color: var(--bad); background: var(--bad-soft); } .live.off i { animation: none; }
@keyframes pulse { 0% { box-shadow: 0 0 0 0 color-mix(in srgb, currentColor 50%, transparent); } 70% { box-shadow: 0 0 0 6px transparent; } 100% { box-shadow: 0 0 0 0 transparent; } }
header .meta { color: var(--muted); font-size: 12.5px; display: flex; gap: 10px; flex-wrap: nowrap; align-items: center; flex: 1; min-width: 0; overflow: hidden; }
.ep { display: inline-flex; align-items: center; gap: 6px; background: var(--bg2); border: 1px solid var(--line); border-radius: 8px; padding: 3px 4px 3px 9px; white-space: nowrap; }
.ep b { font-weight: 600; font-size: 11px; color: var(--faint); letter-spacing: .4px; }
.ep code { font-family: var(--mono); font-size: 11.5px; color: var(--ink); cursor: copy; padding: 1px 6px; border-radius: 5px; }
.ep code:hover { background: var(--accent-soft); color: var(--accent-ink); }
.ep code.copied { background: var(--ok-soft); color: var(--ok); }
.hbtn { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--line); background: var(--panel); padding: 5px 11px; border-radius: 8px; font-size: 12.5px; font-weight: 600; color: var(--ink); white-space: nowrap; }
.hbtn:hover { border-color: var(--line2); text-decoration: none; background: var(--panel2); }
.seg { display: inline-flex; background: var(--bg2); border: 1px solid var(--line); border-radius: 9px; padding: 2px; gap: 2px; }
.seg button { border: 0; background: none; width: 30px; height: 26px; border-radius: 7px; color: var(--muted); display: grid; place-items: center; }
.seg button:hover { color: var(--ink); }
.seg button.on { background: var(--panel); color: var(--accent); box-shadow: var(--shadow); }
main { display: grid; grid-template-columns: 330px 1fr; height: calc(100% - 58px); }
aside { border-right: 1px solid var(--line); overflow-y: auto; background: var(--panel2); padding: 4px 10px 18px; }
aside h2 { font-size: 11px; text-transform: uppercase; letter-spacing: 1px; color: var(--faint); margin: 18px 6px 8px; font-weight: 600; display: flex; justify-content: space-between; }
aside h2 span { color: var(--faint); font-weight: 500; letter-spacing: 0; text-transform: none; }
.item { padding: 10px 12px; border: 1px solid transparent; border-radius: 10px; cursor: pointer; margin-bottom: 4px; transition: background-color .12s, border-color .12s, box-shadow .12s; }
.item:hover { background: var(--panel); border-color: var(--line); }
.item.sel { background: var(--panel); border-color: color-mix(in srgb, var(--accent) 45%, var(--line)); box-shadow: 0 0 0 3px var(--glow); }
.item .t { font-weight: 600; display: flex; justify-content: space-between; gap: 8px; align-items: center; }
.item .t span:first-child { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.item .s { color: var(--muted); font-size: 12.5px; margin-top: 1px; }
.item .bar { height: 3px; border-radius: 3px; background: var(--bg2); margin-top: 7px; overflow: hidden; }
.item .bar i { display: block; height: 100%; border-radius: 3px; background: linear-gradient(90deg, var(--accent), var(--accent2)); }
.item .bar i.err { background: linear-gradient(90deg, var(--bad), #ff9a6b); }
.badge { display: inline-flex; align-items: center; gap: 4px; font-size: 11px; padding: 1px 8px; border-radius: 99px; font-weight: 600; white-space: nowrap; line-height: 1.6; }
.b-ok { background: var(--ok-soft); color: var(--ok); } .b-bad { background: var(--bad-soft); color: var(--bad); }
.b-warn { background: var(--warn-soft); color: var(--warn); } .b-mute { background: var(--bg2); color: var(--muted); }
.chips { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 7px; }
.chip { font-size: 11px; padding: 0 7px 0 6px; border-radius: 6px; background: var(--bg2); color: var(--ink); display: inline-flex; align-items: center; gap: 5px; border: 1px solid var(--line); }
.chip i { width: 7px; height: 7px; border-radius: 2px; }
.empty { color: var(--muted); padding: 10px 12px; font-size: 13px; border: 1px dashed var(--line2); border-radius: 10px; margin: 0 2px; }
section.view { overflow: auto; display: flex; flex-direction: column; min-width: 0; }
.tabs { display: flex; gap: 10px; padding: 10px 18px; border-bottom: 1px solid var(--line); background: color-mix(in srgb, var(--bg) 88%, transparent); backdrop-filter: blur(8px); position: sticky; top: 0; z-index: 2; align-items: center; }
.tabs .seg button { width: auto; padding: 0 14px; height: 30px; display: inline-flex; gap: 7px; font-weight: 500; font-size: 13px; }
.tabs .seg button.on { font-weight: 600; color: var(--ink); }
.tabs .seg button svg { opacity: .75; } .tabs .seg button.on svg { opacity: 1; color: var(--accent); }
.tabs .spacer { flex: 1; }
.toggle { display: inline-flex; align-items: center; gap: 8px; color: var(--muted); font-size: 12.5px; cursor: pointer; user-select: none; }
.toggle input { appearance: none; width: 30px; height: 17px; border-radius: 99px; background: var(--line2); position: relative; cursor: pointer; transition: background .15s; margin: 0; }
.toggle input::after { content: ""; position: absolute; top: 2px; left: 2px; width: 13px; height: 13px; border-radius: 50%; background: #fff; transition: transform .15s; box-shadow: 0 1px 2px rgba(0, 0, 0, .3); }
.toggle input:checked { background: var(--accent); } .toggle input:checked::after { transform: translateX(13px); }
.pane { padding: 18px; animation: fade .18s ease; }
@keyframes fade { from { opacity: .4; transform: translateY(2px); } to { opacity: 1; transform: none; } }
.title { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: 14px; }
.title h3 { margin: 0; font-size: 19px; letter-spacing: -.3px; }
.title .s { color: var(--muted); font-size: 12.5px; }
.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 10px; margin-bottom: 14px; }
.stat { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 10px 14px; box-shadow: var(--shadow); }
.stat b { display: block; font-size: 20px; font-weight: 700; letter-spacing: -.4px; font-variant-numeric: tabular-nums; }
.stat span { font-size: 11px; color: var(--faint); text-transform: uppercase; letter-spacing: .8px; font-weight: 600; }
.stat.bad b { color: var(--bad); } .stat.warn b { color: var(--warn); } .stat.ok b { color: var(--ok); }
svg text { fill: var(--ink); font: 12.5px var(--sans); }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; box-shadow: var(--shadow); }
.seq-wrap { overflow-x: auto; }
.msg { cursor: pointer; }
.msg:hover text.label { fill: var(--accent); }
.msg.sel text.label { fill: var(--accent); font-weight: 700; }
.msg.sel line, .msg.sel path { stroke-width: 2.4; }
.details { margin-top: 14px; padding: 14px 16px; }
.details h4 { margin: 0 0 10px; font-size: 14.5px; display: flex; align-items: center; gap: 10px; }
table.kv { border-collapse: collapse; width: 100%; font-size: 13px; }
table.kv td { border-top: 1px solid var(--line); padding: 5px 8px 5px 0; vertical-align: top; }
table.kv td:first-child { color: var(--muted); white-space: nowrap; width: 1%; padding-right: 18px; }
table.kv td.v { font-family: var(--mono); font-size: 12px; word-break: break-all; }
.wf { padding: 8px 0; }
.wf-row { display: grid; grid-template-columns: minmax(220px, 34%) 1fr 90px; align-items: center; gap: 10px; padding: 4px 14px; cursor: pointer; font-size: 13px; }
.wf-row:hover { background: var(--panel2); } .wf-row.sel { background: var(--accent-soft); }
.wf-name { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.wf-track { position: relative; height: 16px; background: repeating-linear-gradient(90deg, transparent 0 calc(25% - 1px), var(--line) calc(25% - 1px) 25%); border-radius: 4px; }
.wf-bar { position: absolute; top: 2px; height: 12px; border-radius: 4px; min-width: 3px; box-shadow: 0 1px 2px rgba(0, 0, 0, .15); }
.wf-dur { text-align: right; color: var(--muted); font-variant-numeric: tabular-nums; font-size: 12px; white-space: nowrap; }
.wf-row:hover .wf-bar { filter: brightness(1.12); box-shadow: 0 0 0 2px var(--glow); }
.flow-head { display: flex; gap: 14px; align-items: center; flex-wrap: wrap; justify-content: space-between; }
.btn { border: 1px solid var(--line); background: var(--panel); padding: 6px 14px; border-radius: 8px; font-weight: 600; font-size: 13px; transition: background .12s, border-color .12s; }
.btn:hover { background: var(--panel2); border-color: var(--line2); }
.btn.primary { background: linear-gradient(135deg, var(--accent), var(--accent2)); border-color: transparent; color: #fff; box-shadow: 0 2px 10px var(--glow); }
.btn.primary:hover { filter: brightness(1.06); }
.btn:disabled { opacity: .45; cursor: default; filter: none; }
table.steps { border-collapse: separate; border-spacing: 0; width: 100%; font-size: 13px; overflow: hidden; }
table.steps th { text-align: left; font-size: 11px; text-transform: uppercase; letter-spacing: .7px; color: var(--faint); padding: 10px 12px; border-bottom: 1px solid var(--line); font-weight: 600; background: var(--panel2); }
table.steps td { padding: 10px 12px; border-top: 1px solid var(--line); vertical-align: top; }
table.steps tr:first-child td { border-top: 0; }
table.steps tr:hover td { background: var(--panel2); }
table.steps td.mono, .mono { font-family: var(--mono); font-size: 12px; }
.problems { color: var(--bad); font-size: 12.5px; margin-top: 4px; }
.verdict { display: flex; align-items: center; gap: 10px; padding: 12px 16px; border-radius: 12px; margin: 12px 0; font-weight: 600; border: 1px solid transparent; }
.verdict .ic { width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center; color: #fff; flex: none; font-size: 14px; }
.v-pass { background: var(--ok-soft); color: var(--ok); border-color: color-mix(in srgb, var(--ok) 25%, transparent); } .v-pass .ic { background: var(--ok); }
.v-fail { background: var(--bad-soft); color: var(--bad); border-color: color-mix(in srgb, var(--bad) 25%, transparent); } .v-fail .ic { background: var(--bad); }
.v-wait { background: var(--panel); color: var(--muted); border: 1px dashed var(--line2); } .v-wait .ic { background: var(--faint); }
.v-run { background: var(--warn-soft); color: var(--warn); } .v-run .ic { background: var(--warn); }
.hint { color: var(--muted); font-size: 13px; }
.welcome { max-width: 560px; margin: 8vh auto; text-align: center; color: var(--muted); }
.welcome h3 { color: var(--ink); font-size: 20px; margin: 16px 0 6px; letter-spacing: -.3px; }
.welcome .orb { width: 72px; height: 72px; margin: 0 auto; border-radius: 22px; background: linear-gradient(135deg, var(--accent), var(--accent2)); display: grid; place-items: center; box-shadow: 0 10px 40px var(--glow); color: #fff; }
.welcome code { font-family: var(--mono); font-size: 12px; background: var(--panel); border: 1px solid var(--line); padding: 2px 7px; border-radius: 6px; color: var(--ink); }
.spans { display: grid; grid-template-columns: minmax(270px, 30%) 1fr; gap: 14px; height: calc(100vh - 150px); min-height: 420px; }
.span-list { overflow-y: auto; padding-bottom: 6px; }
.span-list h5 { margin: 0; padding: 10px 14px 6px; font-size: 12px; display: flex; align-items: center; gap: 8px; position: sticky; top: 0; background: var(--panel); z-index: 1; font-weight: 600; }
.span-list h5 i { width: 9px; height: 9px; border-radius: 3px; }
.span-row { padding: 7px 12px 7px 14px; margin: 0 6px 2px 6px; cursor: pointer; border-radius: 9px; font-size: 13px; border: 1px solid transparent; }
.span-row:hover { background: var(--panel2); } .span-row.sel { background: var(--accent-soft); border-color: color-mix(in srgb, var(--accent) 35%, transparent); }
.span-row .n { display: flex; justify-content: space-between; gap: 6px; align-items: center; } .span-row .n span:first-child { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 500; }
.span-row .c { font-family: var(--mono); font-size: 11px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; margin-top: 1px; }
.span-row.nocode .c { font-style: italic; color: var(--faint); }
.code { display: flex; flex-direction: column; min-width: 0; overflow: hidden; }
.code-bar { display: flex; align-items: center; gap: 10px; padding: 9px 14px; border-bottom: 1px solid var(--line); flex-wrap: wrap; font-size: 13px; background: var(--panel2); }
.code-bar .path { font-family: var(--mono); font-size: 12.5px; font-weight: 500; flex: 1; min-width: 120px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.code-info { padding: 10px 14px; border-bottom: 1px solid var(--line); font-size: 12.5px; max-height: 30%; overflow: auto; }
.code-info .kvs { font-family: var(--mono); font-size: 11.5px; color: var(--muted); word-break: break-all; margin-top: 4px; }
.span-line { background: var(--code-line); }
#editor { flex: 1; min-height: 240px; position: relative; }
#editor textarea { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; resize: none; padding: 12px 14px; font: 13px/1.55 var(--mono); background: var(--panel); color: var(--ink); tab-size: 4; outline: none; white-space: pre; }
.menu { position: relative; }
.menu-pop { position: absolute; right: 0; top: calc(100% + 6px); width: 300px; background: var(--panel); border: 1px solid var(--line); border-radius: 12px; box-shadow: var(--shadow-lg); padding: 6px; z-index: 10; }
.menu-pop[hidden] { display: none; }
.menu-pop button { display: flex; width: 100%; text-align: left; gap: 10px; align-items: flex-start; border: 0; background: none; padding: 8px 10px; border-radius: 8px; }
.menu-pop button:hover { background: var(--panel2); }
.menu-pop button b { display: block; font-size: 13px; } .menu-pop button span { font-size: 12px; color: var(--muted); }
.menu-pop .sep { height: 1px; background: var(--line); margin: 6px 4px; }
.menu-pop .what { font-size: 12px; color: var(--muted); padding: 4px 10px 6px; }
.menu-pop label { display: flex; gap: 8px; align-items: center; font-size: 12.5px; padding: 6px 10px; color: var(--muted); }
.toast { position: fixed; bottom: 22px; left: 50%; transform: translateX(-50%) translateY(20px); background: var(--ink); color: var(--bg); padding: 9px 16px; border-radius: 10px; font-size: 13px; font-weight: 500; opacity: 0; transition: opacity .2s, transform .2s; pointer-events: none; z-index: 20; box-shadow: var(--shadow-lg); }
.toast.on { opacity: 1; transform: translateX(-50%); }
.tip { position: fixed; pointer-events: none; z-index: 30; background: var(--panel); border: 1px solid var(--line2); border-radius: 10px; box-shadow: var(--shadow-lg); padding: 9px 12px; font-size: 12.5px; min-width: 200px; max-width: 360px; }
.tip[hidden] { display: none; }
.tip .tt { font-weight: 600; margin-bottom: 4px; display: flex; gap: 8px; align-items: center; }
.tip .big { font-size: 18px; font-weight: 700; letter-spacing: -.3px; font-variant-numeric: tabular-nums; }
.tip .row { display: flex; justify-content: space-between; gap: 14px; color: var(--muted); font-variant-numeric: tabular-nums; }
.tip .row b { color: var(--ink); font-weight: 500; }
.wf-axis { display: grid; grid-template-columns: minmax(220px, 34%) 1fr 90px; gap: 10px; padding: 6px 14px 8px; font-size: 11px; color: var(--faint); border-bottom: 1px solid var(--line); font-variant-numeric: tabular-nums; }
.wf-axis .ticks { display: flex; justify-content: space-between; }
@media (max-width: 1100px) { header .meta .ep:nth-child(2) { display: none; } }
@media (max-width: 960px) { .spans { grid-template-columns: 1fr; height: auto; } .code { height: 70vh; } header .meta .ep { display: none; } }
@media (max-width: 760px) { main { grid-template-columns: 1fr; height: auto; } aside { max-height: 45vh; border-right: 0; border-bottom: 1px solid var(--line); } header { height: auto; flex-wrap: wrap; } }
</style>
</head>

<header>
  <div class="brand"><svg width="26" height="26" viewBox="0 0 32 32" aria-hidden="true"><defs><linearGradient id="lg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="var(--accent)"/><stop offset="1" stop-color="var(--accent2)"/></linearGradient></defs>
    <rect width="32" height="32" rx="9" fill="url(#lg)"/><path d="M9 10h9M9 16h14M9 22h6" stroke="#fff" stroke-width="2.6" stroke-linecap="round"/><circle cx="21" cy="10" r="2" fill="#fff"/><circle cx="18.5" cy="22" r="2" fill="#fff"/></svg>dashr
    <span class="live" id="live"><i></i>live</span></div>
  <div class="meta" id="meta">connecting…</div>
  <a class="hbtn" id="jaeger" href="#" target="_blank" rel="noopener" hidden>Jaeger UI <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M7 17L17 7M8 7h9v9"/></svg></a>
  <div class="menu">
    <button class="hbtn" id="export-btn" aria-haspopup="true"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12M7 10l5 5 5-5M5 21h14"/></svg> Export</button>
    <div class="menu-pop" id="export-pop" hidden>
      <div class="what" id="export-what">The selected flow and its trace</div>
      <button data-export="md-copy"><span>📋</span><div><b>Copy Markdown</b><span>Paste into a pull request; GitHub draws the diagram</span></div></button>
      <button data-export="md"><span>⬇️</span><div><b>Markdown file</b><span>.md with a Mermaid sequence diagram</span></div></button>
      <button data-export="html"><span>🌐</span><div><b>HTML report</b><span>A standalone page to attach or open anywhere</span></div></button>
      <button data-export="json"><span>{ }</span><div><b>JSON</b><span>Verdict, sequence and spans</span></div></button>
      <div class="sep"></div>
      <label><input type="checkbox" id="export-raw"> include raw values (no masking)</label>
    </div>
  </div>
  <div class="seg" id="theme" role="radiogroup" aria-label="Theme">
    <button data-theme="light" title="Light" aria-label="Light theme"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg></button>
    <button data-theme="auto" title="Match the system" aria-label="Match the system theme"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="13" rx="2"/><path d="M8 21h8M12 17v4" stroke-linecap="round"/></svg></button>
    <button data-theme="dark" title="Dark" aria-label="Dark theme"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg></button>
  </div>
</header>
<main>
  <aside>
    <h2>Flows <span id="n-flows"></span></h2><div id="flows"></div>
    <h2>Sources <span id="n-sources"></span></h2><div id="sources"></div>
    <h2>Traces <span id="n-traces"></span></h2><div id="traces"></div>
  </aside>
  <section class="view">
    <div class="tabs" id="tabs">
      <div class="seg">
      <button data-tab="sequence" class="on"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M5 3v18M19 3v18M5 8h12M17 6l2 2-2 2M19 15H7M9 13l-2 2 2 2"/></svg> Sequence</button>
      <button data-tab="waterfall"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 5h9M7 10h10M11 15h6M14 20h7"/></svg> Waterfall</button>
      <button data-tab="flow"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 11l3 3 8-8"/><path d="M20 12v6a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h9"/></svg> Flow</button>
      <button data-tab="spans"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 18l6-6-6-6M8 6l-6 6 6 6"/></svg> Spans</button>
      </div>
      <span class="spacer"></span>
      <label class="toggle"><input type="checkbox" id="internal" checked> internal spans</label>
      <label class="toggle"><input type="checkbox" id="follow" checked> follow newest</label>
    </div>
    <div class="pane" id="pane"></div>
  </section>
</main>
<div class="tip" id="tip" hidden></div>
<div class="toast" id="toast"></div>
<script>
"use strict";
const TOKEN = decodeURIComponent(location.hash.slice(1));
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const PALETTE = ["#5161d9", "#0f9d7a", "#d9822b", "#8e5bd8", "#e0475b", "#2b8fd6", "#6f9a1f", "#c2410c", "#0e9aa7", "#a1665e"];
const colour = (name) => { let h = 0; for (const c of String(name)) h = (h * 31 + c.charCodeAt(0)) >>> 0; return PALETTE[h % PALETTE.length]; };
const ms = (v) => v == null ? "" : v >= 1000 ? (v / 1000).toFixed(2) + " s" : v >= 10 ? v.toFixed(0) + " ms" : v.toFixed(1) + " ms";
const ago = (t) => { const s = Math.max(0, (Date.now() - t) / 1000); return s < 60 ? Math.round(s) + "s ago" : s < 3600 ? Math.round(s / 60) + "m ago" : Math.round(s / 3600) + "h ago"; };

let state = null, tab = "sequence", selectedTrace = null, selectedFlow = null, selectedSpan = null;
let trace = null, traceKey = "", lastVersion = -1;
let spans = [], spansVersion = -1, selectedKey = null, file = null, editor = null, monacoState = "idle", dirty = false, opening = null, fileChecked = -1;

async function api(method, path, body) {
  const response = await fetch(path, { method, headers: { "x-dashr-viewer": TOKEN, "content-type": "application/json" }, body: body ? JSON.stringify(body) : undefined });
  if (!response.ok) throw new Error((await response.json().catch(() => ({}))).error || response.status);
  return response.json();
}

function header() {
  const i = state.info;
  const live = $("live");
  live.className = "live" + (state.poll_error ? " off" : "");
  live.innerHTML = `<i></i>${state.poll_error ? "Jaeger down" : "live"}`;
  live.title = state.poll_error || "Reading Jaeger every 1.5 s";
  const jaeger = $("jaeger"); jaeger.hidden = false; jaeger.href = i.jaeger_ui;
  $("meta").innerHTML =
    `<span class="ep"><b>OTLP HTTP</b><code title="Click to copy">${esc(i.otlp_http)}</code></span>` +
    `<span class="ep"><b>gRPC</b><code title="Click to copy">${esc(i.otlp_grpc)}</code></span>` +
    (state.poll_error ? `<span class="badge b-bad" title="${esc(state.poll_error)}">Jaeger: ${esc(state.poll_error.slice(0, 60))}</span>` : "");
  for (const code of $("meta").querySelectorAll("code")) code.onclick = () => {
    navigator.clipboard?.writeText(code.textContent);
    code.classList.add("copied"); setTimeout(() => code.classList.remove("copied"), 900);
  };
}

function verdictBadge(v) {
  return { pass: `<span class="badge b-ok">✓ pass</span>`, fail: `<span class="badge b-bad">✗ fail</span>`, running: `<span class="badge b-warn">● running</span>` }[v.status] || `<span class="badge b-mute">○ waiting</span>`;
}
const chip = (s) => `<span class="chip"><i style="background:${colour(s)}"></i>${esc(s)}</span>`;

function sidebar() {
  $("flows").innerHTML = state.flows.length ? state.flows.map((f) =>
    `<div class="item ${selectedFlow === f.flow.name && tab === "flow" ? "sel" : ""}" data-flow="${esc(f.flow.name)}">
      <div class="t"><span>${esc(f.flow.name)}</span>${verdictBadge(f.verdict)}</div>
      <div class="s">${esc(f.verdict.summary)}</div></div>`).join("") : `<div class="empty">No flow yet. The agent writes the trace your feature should produce.</div>`;
  $("sources").innerHTML = state.sources.length ? state.sources.map((s) => {
    const h = s.health, failing = h.last_error && h.last_ok_ms !== h.last_run_ms;
    return `<div class="item"><div class="t"><span>${esc(s.spec.name)}</span><span class="badge ${failing ? "b-bad" : "b-ok"}">${esc(s.spec.format)}</span></div>
      <div class="s">${failing ? esc(h.last_error) : `${h.spans_total} spans · every ${s.spec.every_secs}s · ${h.last_ok_ms ? ago(h.last_ok_ms) : "never"}`}</div></div>`;
  }).join("") : `<div class="empty">Local services export straight to Jaeger. Remote ones (X-Ray, Azure, …) arrive through sources.</div>`;
  $("n-flows").textContent = state.flows.length || "";
  $("n-sources").textContent = state.sources.length || "";
  $("n-traces").textContent = state.traces.length ? `${state.traces.length} · ${state.spans_total} spans` : "";
  const longest = Math.max(1, ...state.traces.map((t) => t.duration_ms || 0));
  $("traces").innerHTML = state.traces.length ? state.traces.map((t) =>
    `<div class="item ${t.trace_id === selectedTrace && tab !== "flow" && tab !== "spans" ? "sel" : ""}" data-trace="${t.trace_id}">
      <div class="t"><span>${esc(t.root || "(no root yet)")}</span>${t.errors ? `<span class="badge b-bad">${t.errors} err</span>` : ""}</div>
      <div class="s">${ms(t.duration_ms)} · ${t.spans} spans${t.orphans ? ` · <span style="color:var(--warn)">${t.orphans} orphaned</span>` : ""} · ${ago(t.start_ns / 1e6)}</div>
      <div class="chips">${t.services.map(chip).join("")}</div>
      <div class="bar"><i class="${t.errors ? "err" : ""}" style="width:${Math.max(2, (t.duration_ms / longest) * 100).toFixed(1)}%"></i></div></div>`).join("") : `<div class="empty">No traces yet.</div>`;
  for (const el of document.querySelectorAll("[data-flow]")) el.onclick = () => { selectedFlow = el.dataset.flow; setTab("flow"); };
  for (const el of document.querySelectorAll("[data-trace]")) el.onclick = () => { selectedTrace = el.dataset.trace; $("follow").checked = false; selectedSpan = null; if (tab === "flow" || tab === "spans") tab = "sequence"; setTab(tab); };
}

function setTab(name) {
  if (tab === "spans" && name !== "spans" && dirty && !confirm(`Discard your unsaved changes to ${file.path}?`)) return;
  if (name !== "spans") { dirty = false; file = null; }
  tab = name;
  for (const b of $("tabs").querySelectorAll("button")) b.classList.toggle("on", b.dataset.tab === name);
  sidebar();
  loadTrace(true);
}

async function loadTrace(force) {
  if (tab === "spans") return loadSpans(force);
  if (tab === "flow") return render();
  if (!selectedTrace) return render();
  const summary = state.traces.find((t) => t.trace_id === selectedTrace);
  const key = selectedTrace + ":" + (summary ? summary.updated_ms : "");
  if (force || key !== traceKey) {
    try { trace = await api("GET", "/v/trace/" + selectedTrace); traceKey = key; } catch { trace = null; }
  }
  render();
}

function stepMarks() {
  const marks = {};
  for (const f of state.flows) {
    if (!trace || f.verdict.trace_id !== trace.summary.trace_id) continue;
    for (const s of f.verdict.steps) if (s.span_id) marks[s.span_id] = { id: s.id, ok: s.status === "ok" || s.status === "skipped", flow: f.flow.name };
  }
  return marks;
}

function sequenceSvg() {
  const seq = trace.sequence, spans = Object.fromEntries(trace.spans.map((s) => [s.span_id, s]));
  const showInternal = $("internal").checked;
  const messages = seq.messages.filter((m) => showInternal || m.kind !== "self_call");
  const parts = seq.participants, marks = stepMarks();
  const room = ($("pane").clientWidth || 1200) - 120;
  const colW = Math.max(132, Math.min(190, Math.floor(room / Math.max(1, parts.length))));
  const left = 86, top = 58, rowH = 30, nameChars = Math.floor((colW - 28) / 7.5);
  const x = (p) => left + parts.indexOf(p) * colW + colW / 2;
  // Calls, then their returns, in time order.
  const events = [];
  for (const m of messages) {
    events.push({ t: m.start_ns, type: 0, m });
    if (m.kind === "call" && m.from !== m.to) events.push({ t: m.end_ns, type: 1, m });
  }
  events.sort((a, b) => a.t - b.t || a.type - b.type);
  const rows = new Map(); events.forEach((e, i) => { if (e.type === 0) rows.set(e.m.span_id, { start: i }); else rows.get(e.m.span_id).end = i; });
  const width = left + parts.length * colW + 40, height = top + events.length * rowH + 40;
  let svg = `<svg width="${width}" height="${height}" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="sequence diagram">
    <defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="currentColor"/></marker>
    <marker id="open" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10" fill="none" stroke="currentColor" stroke-width="1.5"/></marker></defs>`;
  parts.forEach((p) => {
    const cx = x(p), c = p === "caller" ? "var(--muted)" : p === "?" ? "var(--warn)" : colour(p);
    svg += `<line x1="${cx}" y1="${top - 14}" x2="${cx}" y2="${height - 20}" stroke="var(--life)" stroke-dasharray="4 4"/>`;
    svg += p === "caller" ? `<rect x="${cx - colW / 2 + 10}" y="10" width="${colW - 20}" height="30" rx="9" fill="var(--panel2)" stroke="var(--line2)" stroke-dasharray="4 3"/>`
      : `<rect x="${cx - colW / 2 + 10}" y="10" width="${colW - 20}" height="30" rx="9" fill="${c}"/><rect x="${cx - colW / 2 + 10}" y="10" width="${colW - 20}" height="15" rx="9" fill="#fff" opacity=".10"/>`;
    svg += `<text x="${cx}" y="30" text-anchor="middle" style="fill:${p === "caller" ? "var(--ink)" : "#fff"};font-weight:600"><title>${esc(p)}</title>${esc(p.length > nameChars ? p.slice(0, nameChars - 1) + "…" : p)}</text>`;
  });
  // Activation bars on the callee while a call runs.
  for (const m of messages) {
    const r = rows.get(m.span_id);
    if (m.kind === "call" && m.from !== m.to && r.end != null) {
      svg += `<rect x="${x(m.to) - 4}" y="${top + r.start * rowH}" width="8" height="${(r.end - r.start) * rowH}" fill="${m.error ? "var(--bad-soft)" : "var(--accent-soft)"}" stroke="${m.error ? "var(--bad)" : "var(--line)"}"/>`;
    }
  }
  events.forEach((e, i) => {
    const m = e.m, y = top + i * rowH + rowH / 2, span = spans[m.span_id] || {};
    const c = m.error ? "var(--bad)" : e.type === 1 ? "var(--muted)" : "var(--ink)";
    const off = ms((e.t - seq.start_ns) / 1e6);
    svg += `<text x="8" y="${y + 4}" style="fill:var(--muted);font-size:11px">+${off}</text>`;
    const sel = m.span_id === selectedSpan ? " sel" : "";
    const mark = marks[m.span_id];
    const badge = mark && e.type === 0 ? ` <tspan style="fill:${mark.ok ? "var(--ok)" : "var(--bad)"};font-weight:700">[${mark.ok ? "✓" : "✗"} ${esc(mark.id)}]</tspan>` : "";
    if (e.type === 0 && m.from === m.to) {
      const cx = x(m.from);
      svg += `<g class="msg${sel}" data-span="${m.span_id}" style="color:${c}"><path d="M${cx + 5},${y - 8} h28 v14 h-26" fill="none" stroke="currentColor" marker-end="url(#arr)"/>
        <text class="label" x="${cx + 40}" y="${y + 4}" style="${m.error ? "fill:var(--bad)" : ""}">${esc(m.label.length > 40 ? m.label.slice(0, 39) + "…" : m.label)} <tspan style="fill:var(--muted);font-size:11px">${ms((m.end_ns - m.start_ns) / 1e6)}</tspan>${badge}</text></g>`;
      return;
    }
    const from = e.type === 0 ? m.from : m.to, to = e.type === 0 ? m.to : m.from;
    const x1 = x(from) + (x(to) > x(from) ? 5 : -5), x2 = x(to) + (x(to) > x(from) ? -5 : 5);
    const dash = e.type === 1 ? ` stroke-dasharray="5 4"` : m.kind === "async" ? ` stroke-dasharray="2 3"` : "";
    const head = m.kind === "async" || e.type === 1 ? "open" : "arr";
    const label = e.type === 0 ? m.label : (m.error ? "✗ " + (span.status_message || "error") : "") + " " + ms((m.end_ns - m.start_ns) / 1e6);
    const mid = (x1 + x2) / 2, maxChars = Math.max(10, Math.floor(Math.abs(x2 - x1) / 7));
    svg += `<g class="msg${sel}" data-span="${m.span_id}" style="color:${c}"><line x1="${x1}" y1="${y + 4}" x2="${x2}" y2="${y + 4}" stroke="currentColor" stroke-width="${e.type === 0 ? 1.6 : 1.2}"${dash} marker-end="url(#${head})"/>
      <text class="label" x="${mid}" y="${y - 2}" text-anchor="middle" style="${m.error ? "fill:var(--bad);" : ""}${e.type === 1 ? "fill:var(--muted);font-size:11.5px" : ""}">${esc(label.trim().length > maxChars ? label.trim().slice(0, maxChars - 1) + "…" : label.trim())}${badge}</text></g>`;
  });
  return svg + "</svg>";
}

function spanDetails() {
  const s = trace && trace.spans.find((sp) => sp.span_id === selectedSpan);
  if (!s) return `<div class="card details hint">Click an arrow or a bar for the span's attributes.</div>`;
  const rows = [["service", s.service], ["kind", s.kind], ["duration", ms((s.end_ns - s.start_ns) / 1e6)], ["status", s.status + (s.status_message ? ": " + s.status_message : "")], ["source", s.source], ["span id", s.span_id], ["parent", s.parent_id || "—"]];
  const attrs = Object.entries(s.attributes || {}), res = Object.entries(s.resource || {});
  const known = spans.find((x) => x.service === s.service && x.span === s.name && x.code);
  return `<div class="card details"><h4>${chip(s.service)} ${esc(s.name)}${s.status === "error" ? ` <span class="badge b-bad">error</span>` : ""}${known ? ` <a href="#" id="open-code" class="hbtn" style="margin-left:auto">Open code</a>` : ""}</h4><table class="kv">${rows.map(([k, v]) => `<tr><td>${k}</td><td class="v">${esc(v)}</td></tr>`).join("")}
    ${attrs.map(([k, v]) => `<tr><td>${esc(k)}</td><td class="v">${esc(typeof v === "string" ? v : JSON.stringify(v))}</td></tr>`).join("")}
    ${(s.events || []).map((ev) => `<tr><td>event</td><td class="v">${esc(ev.name)} ${esc(JSON.stringify(ev.attributes || {}))}</td></tr>`).join("")}
    ${res.length ? `<tr><td>resource</td><td class="v">${esc(res.map(([k, v]) => `${k}=${typeof v === "string" ? v : JSON.stringify(v)}`).join("  "))}</td></tr>` : ""}</table></div>`;
}

function waterfall() {
  const spans = trace.spans, t0 = Math.min(...spans.map((s) => s.start_ns)), t1 = Math.max(...spans.map((s) => s.end_ns)), total = Math.max(1, t1 - t0);
  const children = {}, ids = new Set(spans.map((s) => s.span_id));
  for (const s of spans) { const p = s.parent_id && ids.has(s.parent_id) ? s.parent_id : "root"; (children[p] ||= []).push(s); }
  const ordered = []; const walk = (id, depth) => { for (const s of (children[id] || []).sort((a, b) => a.start_ns - b.start_ns)) { ordered.push([s, depth]); walk(s.span_id, depth + 1); } };
  walk("root", 0);
  const tick = (f) => ms((total * f) / 1e6);
  return `<div class="card wf"><div class="wf-axis"><span>span</span><div class="ticks"><span>0</span><span>${tick(.25)}</span><span>${tick(.5)}</span><span>${tick(.75)}</span><span>${tick(1)}</span></div><span style="text-align:right">duration</span></div>${ordered.map(([s, d]) => {
    const l = ((s.start_ns - t0) / total) * 100, w = ((s.end_ns - s.start_ns) / total) * 100;
    return `<div class="wf-row ${s.span_id === selectedSpan ? "sel" : ""}" data-span="${s.span_id}">
      <div class="wf-name" style="padding-left:${d * 14}px" title="${esc(s.service)}: ${esc(s.name)}"><span style="color:${colour(s.service)}">●</span> ${esc(s.name)} <span class="hint">${esc(s.service)}</span></div>
      <div class="wf-track"><div class="wf-bar" data-tip="${s.span_id}" style="left:${l}%;width:${w}%;background:${s.status === "error" ? "var(--bad)" : colour(s.service)}"></div></div>
      <div class="wf-dur">${ms((s.end_ns - s.start_ns) / 1e6)}</div></div>`;
  }).join("")}</div>`;
}

function flowView() {
  const f = state.flows.find((x) => x.flow.name === selectedFlow) || state.flows[0];
  if (!f) return `<p class="hint">No flow yet. The agent writes the flow it expects your feature to produce — services, spans, attributes, where in the code each span is made — and every run is checked against it here.</p>`;
  selectedFlow = f.flow.name;
  const v = f.verdict;
  const byId = Object.fromEntries(v.steps.map((s) => [s.id, s]));
  const cls = { pass: "v-pass", fail: "v-fail", running: "v-run" }[v.status] || "v-wait";
  const head = { pass: "Passed", fail: "Failed", running: "Trace arriving" }[v.status] || "Waiting for a run";
  const icon = { pass: "✓", fail: "✗", running: "…" }[v.status] || "○";
  const expect = (a) => Object.entries(a || {}).map(([k, e]) => `${esc(k)} ${e === "*" ? "present" : e === "!" ? "<b>absent</b>" : typeof e === "string" && e.startsWith("re:") ? "~ " + esc(e.slice(3)) : "= " + esc(JSON.stringify(e))}`).join("<br>");
  const status = (s) => !s ? "" : s.status === "ok" ? `<span class="badge b-ok">ok</span>` : s.status === "skipped" ? `<span class="badge b-mute">skipped</span>` : `<span class="badge ${s.status === "missing" && v.status !== "fail" ? "b-mute" : "b-bad"}">${esc(s.status.replace(/_/g, " "))}</span>`;
  return `<div class="flow-head"><div class="title"><h3>${esc(f.flow.name)}</h3><span class="s">${esc(f.flow.description || "")}</span></div>
      <button class="btn" id="arm" title="Forget earlier runs: count only runs from now on">Re-arm</button></div>
    <div class="verdict ${cls}"><span class="ic">${icon}</span><span>${head} — ${esc(v.summary)}</span>${v.trace_id ? `<a href="#" id="open-trace" class="hbtn" style="margin-left:auto">Open trace</a>` : ""}</div>
    <div class="card" style="overflow:hidden"><table class="steps"><tr><th>#</th><th>Service</th><th>Span</th><th>Expected attributes</th><th>Code</th><th>Status</th></tr>
    ${f.flow.steps.map((s) => { const res = byId[s.id]; return `<tr><td class="mono">${esc(s.id)}</td><td><span style="color:${colour(s.service)}">●</span> ${esc(s.service)}</td>
      <td>${esc(s.span)}${s.kind ? ` <span class="hint">${esc(s.kind)}</span>` : ""}${s.optional ? ` <span class="badge b-mute">optional</span>` : ""}${s.error ? ` <span class="badge b-warn">expects error</span>` : ""}${s.why ? `<div class="hint">${esc(s.why)}</div>` : ""}</td>
      <td class="mono">${expect(s.attributes)}${s.max_ms ? `<br>≤ ${s.max_ms} ms` : ""}${s.count ? `<br>count ${s.count.min ?? 0}..${s.count.max ?? "∞"}` : ""}</td>
      <td class="mono">${s.code ? `<a href="#" data-code-step="${esc(s.service)}\n${esc(s.span)}">${esc(s.code)}</a>` : ""}</td><td>${status(res)}${res && res.duration_ms != null ? ` <span class="hint">${ms(res.duration_ms)}</span>` : ""}${res && res.problems && res.problems.length ? `<div class="problems">${res.problems.map(esc).join("<br>")}</div>` : ""}</td></tr>`; }).join("")}</table></div>
    ${(v.unexpected_errors || []).length ? `<div class="card details"><h4>Unexpected errors</h4>${v.unexpected_errors.map((e) => `<div class="problems">${esc(e.service)} · ${esc(e.span)}: ${esc(e.message)}</div>`).join("")}</div>` : ""}
    ${(v.forbidden || []).length ? `<div class="card details"><h4>Forbidden spans</h4>${v.forbidden.map((e) => `<div class="problems">${esc(e.service)} · ${esc(e.span)}</div>`).join("")}</div>` : ""}`;
}

// ------------------------------------------------------------ spans

const keyOf = (s) => s.service + "\n" + s.span;

async function loadSpans(force) {
  if (force || state.version !== spansVersion) {
    try { spans = await api("GET", "/v/spans"); spansVersion = state.version; } catch { spans = []; }
  }
  if (tab === "spans") render();
}

function openSpan(service, span) {
  selectedKey = service + "\n" + span;
  setTab("spans");
}

function spanList() {
  if (!spans.length) return `<div class="empty" style="padding:14px">No spans yet. The agent lists the spans it added with <span class="mono">dashr spans set</span>; spans from runs appear here as they arrive.</div>`;
  let html = "", service = null;
  for (const s of spans) {
    if (s.service !== service) { service = s.service; html += `<h5><span style="color:${colour(service)}">●</span>${esc(service)}</h5>`; }
    const where = s.code ? s.code.file.split(/[\\/]/).pop() + (s.code.line ? ":" + s.code.line : "") + (s.code.function ? " · " + s.code.function : "") : "no code location";
    const badge = s.errors ? `<span class="badge b-bad">${s.errors} err</span>` : s.seen ? `<span class="badge b-ok" title="seen in the traces">${s.seen}×</span>` : `<span class="badge b-mute" title="planned, not seen in a run yet">not seen</span>`;
    html += `<div class="span-row ${keyOf(s) === selectedKey ? "sel" : ""} ${s.code ? "" : "nocode"}" data-key="${esc(keyOf(s))}">
      <div class="n"><span title="${esc(s.span)}">${esc(s.span)}</span>${badge}</div><div class="c" title="${esc(s.code ? s.code.file : "")}">${esc(where)}</div></div>`;
  }
  return html;
}

function spanInfo(s) {
  if (!s) return "";
  const attrs = Object.entries(s.last_attributes || {});
  const expected = (s.expected_attributes || []).filter((k) => !(k in (s.last_attributes || {})));
  return `${s.why ? `<div>${esc(s.why)}</div>` : ""}
    <div class="hint">${s.planned ? "planned by the agent" : "seen in a run"}${s.located_by ? ` · located by ${esc(s.located_by)}` : ""}${s.seen ? ` · seen ${s.seen}× · last ${ms(s.last_duration_ms)}` : " · not seen in a run yet"}${s.last_trace_id ? ` · <a href="#" id="span-trace">last trace</a>` : ""}</div>
    ${attrs.length ? `<div class="kvs">${attrs.map(([k, v]) => `${esc(k)}=${esc(typeof v === "string" ? v : JSON.stringify(v))}`).join(" · ")}</div>` : ""}
    ${expected.length ? `<div class="kvs" style="color:var(--warn)">expected, not seen: ${expected.map(esc).join(", ")}</div>` : ""}`;
}

function spansView() {
  const pane = $("pane");
  if (!$("span-list")) {
    pane.innerHTML = `<div class="spans"><div class="span-list" id="span-list"></div>
      <div class="code"><div class="code-bar"><span class="path" id="code-path">Pick a span to see the code that makes it.</span>
        <span class="hint" id="code-state"></span><a id="code-vscode" href="#" hidden>Open in VS Code ↗</a>
        <button class="btn primary" id="code-save" disabled title="Ctrl+S">Save</button></div>
        <div class="code-info" id="code-info" hidden></div><div id="editor"></div></div></div>`;
    $("code-save").onclick = save;
    file = null;
    if (editor && editor.dispose) editor.dispose();
    editor = null;
  }
  const list = $("span-list"), scroll = list.scrollTop;
  list.innerHTML = spanList();
  list.scrollTop = scroll;
  for (const el of list.querySelectorAll("[data-key]")) el.onclick = () => { selectedKey = el.dataset.key; spansView(); };
  const s = spans.find((x) => keyOf(x) === selectedKey);
  const info = $("code-info");
  info.hidden = !s; info.innerHTML = spanInfo(s);
  const lt = $("span-trace"); if (lt) lt.onclick = (e) => { e.preventDefault(); selectedTrace = s.last_trace_id; selectedSpan = s.last_span_id; $("follow").checked = false; setTab("sequence"); };
  if (s && s.code && opening !== selectedKey && (!file || file.key !== selectedKey)) openFile(s);
  else if (file && !dirty && opening === null && fileChecked !== state.version) refreshFile();
  if (s && !s.code) { $("code-path").textContent = `${s.span}: no code location`; showMessage(state.code_root ? "The agent did not say where this span is made. It adds the file and function with `dashr spans set`; spans with code.* attributes are located automatically." : "No code root yet: the agent sets it with `dashr spans set` from the repository."); }
}

function showMessage(text) {
  file = null; dirty = false;
  if (editor && editor.dispose) editor.dispose();
  editor = null;
  $("editor").innerHTML = `<p class="hint" style="padding:12px">${esc(text)}</p>`;
  $("code-save").disabled = true; $("code-vscode").hidden = true; $("code-state").textContent = "";
}

async function openFile(s) {
  if (dirty && !confirm(`Discard your unsaved changes to ${file.path}?`)) { selectedKey = file.key; spansView(); return; }
  const key = selectedKey;
  opening = key;
  let loaded;
  try { loaded = await api("GET", "/v/code?path=" + encodeURIComponent(s.code.file)); }
  catch (error) { opening = null; if (key === selectedKey) { $("code-path").textContent = s.code.file; showMessage(String(error.message || error)); file = { key, requested: s.code.file, failed: true }; } return; }
  opening = null;
  fileChecked = state.version;
  if (key !== selectedKey) return;
  file = { ...loaded, requested: s.code.file, key, line: s.code.line || 1 };
  dirty = false;
  $("code-path").textContent = file.path; $("code-path").title = file.absolute;
  const vs = $("code-vscode"); vs.hidden = false;
  vs.href = "vscode://file/" + file.absolute.replace(/\\/g, "/").replace(/^\/?/, "/").replace(/^\/([A-Za-z]:)/, "$1") + ":" + file.line;
  $("code-state").textContent = "";
  $("code-save").disabled = true;
  await showEditor();
}

const MONACO = "https://cdn.jsdelivr.net/npm/monaco-editor@0.52.2/min";
function loadMonaco() {
  if (monacoState !== "idle") return;
  monacoState = "loading";
  window.MonacoEnvironment = { getWorkerUrl: () => "data:text/javascript;charset=utf-8," + encodeURIComponent(`self.MonacoEnvironment={baseUrl:"${MONACO}/"};importScripts("${MONACO}/vs/base/worker/workerMain.js");`) };
  const script = document.createElement("script");
  script.src = MONACO + "/vs/loader.js";
  script.onload = () => { window.require.config({ paths: { vs: MONACO + "/vs" } }); window.require(["vs/editor/editor.main"], () => { monacoState = "ready"; if (file) showEditor(); }, () => { monacoState = "failed"; if (file) showEditor(); }); };
  script.onerror = () => { monacoState = "failed"; if (file) showEditor(); };
  document.head.appendChild(script);
  setTimeout(() => { if (monacoState === "loading") { monacoState = "failed"; if (file) showEditor(); } }, 8000);
}

function markDirty() {
  if (!file) return;
  dirty = editorText() !== file.content;
  $("code-save").disabled = !dirty;
  $("code-state").textContent = dirty ? "● modified" : "";
}

function editorText() { return editor ? (editor.getValue ? editor.getValue() : editor.value) : ""; }

async function showEditor() {
  if (!file) return;
  if (monacoState === "idle" || monacoState === "loading") { loadMonaco(); if (monacoState === "loading" && !editor) $("editor").innerHTML = `<p class="hint" style="padding:12px">Loading the editor…</p>`; if (monacoState === "loading") return; }
  const host = $("editor");
  if (editor && editor.dispose) editor.dispose();
  host.innerHTML = "";
  if (monacoState === "ready") {
    const dark = isDark();
    editor = monaco.editor.create(host, { value: file.content, language: file.language, theme: dark ? "vs-dark" : "vs", automaticLayout: true, minimap: { enabled: false }, fontSize: 13, scrollBeyondLastLine: false });
    editor.revealLineInCenter(file.line);
    editor.setPosition({ lineNumber: file.line, column: 1 });
    editor.createDecorationsCollection([{ range: new monaco.Range(file.line, 1, file.line, 1), options: { isWholeLine: true, className: "span-line", hoverMessage: { value: "the span is made here" } } }]);
    editor.addCommand(monaco.KeyMod.CtrlCmd | monaco.KeyCode.KeyS, save);
    editor.onDidChangeModelContent(markDirty);
    editor.focus();
  } else {
    // The CDN is out of reach: a plain editor still edits and saves.
    const area = document.createElement("textarea");
    area.spellcheck = false; area.value = file.content; area.id = "code-text";
    host.appendChild(area);
    editor = area;
    area.oninput = markDirty;
    const before = file.content.split("\n").slice(0, file.line - 1).join("\n").length + (file.line > 1 ? 1 : 0);
    area.focus(); area.setSelectionRange(before, before);
    area.scrollTop = Math.max(0, (file.line - 8) * 19.5);
  }
}

// The agent edits code too: show its changes while you have none.
async function refreshFile() {
  fileChecked = state.version;
  if (file.failed) return;
  try {
    const loaded = await api("GET", "/v/code?path=" + encodeURIComponent(file.requested));
    if (!file || dirty || loaded.version === file.version) return;
    file.content = loaded.content; file.version = loaded.version;
    if (editor && editor.getModel) { const view = editor.saveViewState(); editor.setValue(loaded.content); editor.restoreViewState(view); }
    else if (editor) { const top = editor.scrollTop; editor.value = loaded.content; editor.scrollTop = top; }
    markDirty();
    $("code-state").textContent = "reloaded: changed on disk";
  } catch { /* gone or moved: keep what is shown */ }
}

let saving = false;
async function save() {
  if (!file || !dirty || saving) return;
  const content = editorText();
  saving = true;
  try {
    const result = await api("PUT", "/v/code", { path: file.requested, content, version: file.version });
    file.content = content; file.version = result.version;
    markDirty();
    $("code-state").textContent = `saved · ${result.lines_changed} line${result.lines_changed === 1 ? "" : "s"} changed`;
  } catch (error) {
    $("code-state").textContent = "⚠ " + (error.message || error);
  } finally { saving = false; }
}

addEventListener("keydown", (e) => { if ((e.ctrlKey || e.metaKey) && e.key === "s" && tab === "spans") { e.preventDefault(); save(); } });
addEventListener("beforeunload", (e) => { if (dirty) e.preventDefault(); });

function welcome() {
  const i = state ? state.info : null;
  return `<div class="welcome"><div class="orb"><svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 6h10M4 12h16M4 18h7"/></svg></div>
    <h3>Waiting for the first trace</h3>
    <p>Point a service's OpenTelemetry exporter at ${i ? `<code>${esc(i.otlp_http)}</code> (HTTP) or <code>${esc(i.otlp_grpc)}</code> (gRPC)` : "the session"}, or let the agent add a pull source. Traces appear here live.</p></div>`;
}

function fmtOffset(ns) { return "+" + ms(ns / 1e6); }

// Hovering a waterfall bar or an arrow: how long the span ran, when it
// started and ended.
function hookTips(root) {
  const tip = $("tip");
  const t0 = Math.min(...trace.spans.map((s) => s.start_ns));
  const byId = Object.fromEntries(trace.spans.map((s) => [s.span_id, s]));
  for (const row of root.querySelectorAll(".wf-row, g.msg")) {
    const s = byId[row.dataset.span];
    if (!s) continue;
    row.onmousemove = (e) => {
      const dur = (s.end_ns - s.start_ns) / 1e6;
      const parent = s.parent_id && byId[s.parent_id];
      const share = parent ? ` · ${(((s.end_ns - s.start_ns) / Math.max(1, parent.end_ns - parent.start_ns)) * 100).toFixed(0)}% of its parent` : "";
      tip.innerHTML = `<div class="tt">${chip(s.service)}<span>${esc(s.name)}</span></div>
        <div class="big" style="color:${s.status === "error" ? "var(--bad)" : "var(--ink)"}">${ms(dur)}${dur >= 1000 ? ` <span class="hint">${dur.toFixed(0)} ms</span>` : ""}</div>
        <div class="row"><span>start</span><b>${fmtOffset(s.start_ns - t0)}</b></div>
        <div class="row"><span>end</span><b>${fmtOffset(s.end_ns - t0)}</b></div>
        <div class="row"><span>kind</span><b>${esc(s.kind)}${share}</b></div>
        ${s.status === "error" ? `<div class="problems">✗ ${esc(s.status_message || "error")}</div>` : ""}`;
      tip.hidden = false;
      const x = Math.min(e.clientX + 14, innerWidth - tip.offsetWidth - 8), y = Math.min(e.clientY + 14, innerHeight - tip.offsetHeight - 8);
      tip.style.left = x + "px"; tip.style.top = y + "px";
    };
    row.onmouseleave = () => { tip.hidden = true; };
  }
}

function toast(text) {
  const t = $("toast"); t.textContent = text; t.classList.add("on");
  clearTimeout(toast.timer); toast.timer = setTimeout(() => t.classList.remove("on"), 2200);
}

// ------------------------------------------------------------ theme

let theme = "auto";
try { theme = localStorage.getItem("dashr-theme") || "auto"; } catch {}
const isDark = () => theme === "dark" || (theme === "auto" && matchMedia("(prefers-color-scheme: dark)").matches);
function applyTheme(next) {
  theme = next;
  if (next === "auto") delete document.documentElement.dataset.theme; else document.documentElement.dataset.theme = next;
  try { localStorage.setItem("dashr-theme", next); } catch {}
  for (const b of $("theme").querySelectorAll("button")) { b.classList.toggle("on", b.dataset.theme === next); b.setAttribute("aria-checked", b.dataset.theme === next); }
  if (window.monaco) monaco.editor.setTheme(isDark() ? "vs-dark" : "vs");
}
for (const b of $("theme").querySelectorAll("button")) b.onclick = () => applyTheme(b.dataset.theme);
matchMedia("(prefers-color-scheme: dark)").addEventListener?.("change", () => applyTheme(theme));
applyTheme(theme);

// ------------------------------------------------------------ export

function exportTarget() {
  if (tab === "flow" && selectedFlow) return { flow: selectedFlow, what: `Flow “${selectedFlow}” and the trace it judged` };
  if (tab !== "flow" && tab !== "spans" && selectedTrace) {
    const f = state && state.flows.find((x) => x.verdict.trace_id === selectedTrace);
    return f ? { flow: f.flow.name, trace: selectedTrace, what: `This trace with flow “${f.flow.name}”` } : { trace: selectedTrace, what: "This trace" };
  }
  return { what: "The first flow, or the newest trace" };
}

async function doExport(kind) {
  const target = exportTarget(), format = kind.startsWith("md") ? "md" : kind;
  const q = new URLSearchParams({ format });
  if (target.flow) q.set("flow", target.flow);
  if (target.trace) q.set("trace", target.trace);
  if ($("export-raw").checked) q.set("raw", "1");
  try {
    const response = await fetch("/v/export?" + q, { headers: { "x-dashr-viewer": TOKEN } });
    if (!response.ok) throw new Error((await response.json().catch(() => ({}))).error || response.status);
    const text = await response.text();
    if (kind === "md-copy") { await navigator.clipboard.writeText(text); toast("Markdown copied: paste it into the pull request"); return; }
    const name = `dashr-${(target.flow || target.trace || "report").replace(/[^A-Za-z0-9._-]+/g, "-").slice(0, 40)}.${format}`;
    const url = URL.createObjectURL(new Blob([text], { type: response.headers.get("content-type") || "text/plain" }));
    const a = document.createElement("a"); a.href = url; a.download = name; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 1000);
    toast(`Saved ${name}`);
  } catch (error) { toast("Export failed: " + (error.message || error)); }
}
$("export-btn").onclick = (e) => { e.stopPropagation(); const pop = $("export-pop"); pop.hidden = !pop.hidden; $("export-what").textContent = exportTarget().what; };
$("export-pop").onclick = (e) => e.stopPropagation();
for (const b of document.querySelectorAll("[data-export]")) b.onclick = () => { $("export-pop").hidden = true; doExport(b.dataset.export); };
addEventListener("click", () => { $("export-pop").hidden = true; });

function render() {
  const pane = $("pane");
  if (tab === "spans") return spansView();
  if (tab === "flow") {
    pane.innerHTML = flowView();
    const f = selectedFlow;
    if ($("arm")) $("arm").onclick = () => api("POST", `/v/flows/${encodeURIComponent(f)}/arm`).then(() => poll(true));
    for (const a of pane.querySelectorAll("[data-code-step]")) a.onclick = (e) => { e.preventDefault(); const [service, span] = a.dataset.codeStep.split("\n"); openSpan(service, span); };
    const open = $("open-trace"); if (open) open.onclick = (e) => { e.preventDefault(); selectedTrace = state.flows.find((x) => x.flow.name === f).verdict.trace_id; $("follow").checked = false; setTab("sequence"); };
    return;
  }
  if (!trace) { pane.innerHTML = welcome(); return; }
  const s = trace.summary;
  const title = `<div class="title"><h3>${esc(s.root || s.trace_id)}</h3><span class="s mono">${s.trace_id}</span>
    <a class="hbtn" style="margin-left:auto" href="${esc(state.info.jaeger_ui)}/trace/${s.trace_id}" target="_blank" rel="noopener">Open in Jaeger</a></div>
    <div class="stats"><div class="stat"><b>${ms(s.duration_ms)}</b><span>duration</span></div><div class="stat"><b>${s.spans}</b><span>spans</span></div>
    <div class="stat"><b>${s.services.length}</b><span>services</span></div><div class="stat ${s.errors ? "bad" : "ok"}"><b>${s.errors}</b><span>errors</span></div>
    ${s.orphans ? `<div class="stat warn" title="Spans whose parent never arrived: broken context propagation?"><b>${s.orphans}</b><span>lost parents</span></div>` : ""}</div>`;
  pane.innerHTML = title + (tab === "sequence" ? `<div class="card seq-wrap">${sequenceSvg()}</div>` : waterfall()) + spanDetails();
  hookTips(pane);
  for (const el of pane.querySelectorAll("[data-span]")) el.onclick = () => { selectedSpan = el.dataset.span; render(); };
  const oc = $("open-code"); if (oc) oc.onclick = (e) => { e.preventDefault(); const sp = trace.spans.find((x) => x.span_id === selectedSpan); openSpan(sp.service, sp.name); };
}

async function poll(force) {
  try {
    state = await api("GET", "/v/state");
  } catch (error) {
    $("dot").className = "dot off";
    $("meta").textContent = TOKEN ? "the session stopped (pane closed?)" : "open this page from the link in the dashr pane";
    return;
  }
  header();
  if ($("follow").checked && state.traces.length) {
    const newest = state.traces[0].trace_id;
    if (newest !== selectedTrace) { selectedTrace = newest; selectedSpan = null; }
  }
  if (!selectedTrace && state.traces.length) selectedTrace = state.traces[0].trace_id;
  if (force || state.version !== lastVersion) {
    lastVersion = state.version;
    sidebar();
    await loadTrace(force);
    if (tab !== "spans" && state.version !== spansVersion) loadSpans(false);
  }
}

for (const b of $("tabs").querySelectorAll("button")) b.onclick = () => setTab(b.dataset.tab);
$("internal").onchange = () => render();
$("follow").onchange = () => poll(true);
poll(true);
setInterval(() => poll(false), 1000);
</script>
</body>
</html>
