# Tempo configuration for the grafana/otel-lgtm image, mounted over the
# image's own /otel-lgtm/tempo-config.yaml by dashr (DEC-033). It is the
# image's file (otel-lgtm 0.34.0, Tempo 3.0.3) plus the settings at the end,
# which make a trace searchable within about two seconds instead of thirty.
server:
  http_listen_port: 3200
  grpc_listen_port: 9096

distributor:
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: "127.0.0.1:4417"
        http:
          endpoint: "127.0.0.1:4418"

memberlist:
  bind_addr: [127.0.0.1]
  bind_port: 7947

querier:
  frontend_worker:
    frontend_address: 127.0.0.1:9096

storage:
  trace:
    backend: local
    wal:
      path: /data/tempo/wal
    local:
      path: /data/tempo/blocks

metrics_generator:
  processor:
    span_metrics:
      dimensions:
        - service_name
        - operation
        - status_code
  storage:
    path: /data/tempo/generator/wal
    remote_write:
      - url: http://127.0.0.1:9090/api/v1/write
        send_exemplars: true

overrides:
  defaults:
    metrics_generator:
      processors: [service-graphs, span-metrics]

# dashr: search the most recent data too (the default cuts the last 30 s
# from every query), and move traces out of the live set quickly.
query_frontend:
  query_end_cutoff: 1s

live_store:
  max_trace_idle: 1s
  max_trace_live: 5s
  flush_check_period: 1s
